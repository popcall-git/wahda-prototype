<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Wahda Reels</title>
<style>
  /* Wahda Reels — short-video feed (Douyin-style), light-theme sheets on a dark video canvas */
  :root {
    --bg: #F4F2EE; --surface: #FFFFFF; --surface-2: #EFECE5; --card: #FFFFFF;
    --text: #1C1B18; --text-2: #6B6A66; --text-3: #9B9993;
    --accent: #0E7C66; --accent-deep: #0A5D4E; --accent-soft: #E1EFEB;
    --hot: #E24B4A; --like: #FE2C55; --gold: #C9803B; --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif; background: #000; overflow: hidden; }
  button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  img { display: block; }

  /* standalone preview chrome (hidden inside the app shell) */
  #statusbar {
    display: none; height: 44px; align-items: center; justify-content: space-between;
    padding: 0 24px; color: #fff; font-size: 14px; font-weight: 700;
    position: relative; z-index: 40;
  }
  #homebar { display: none; height: 22px; position: relative; z-index: 40; }
  #homebar::after {
    content: ""; position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
    width: 130px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.85);
  }
  body.standalone { background: #000; }
  body.standalone #statusbar, body.standalone #homebar { display: flex; }
  body.standalone #stage { height: calc(100% - 66px); }

  #stage { position: relative; height: 100%; overflow: hidden; background: #000; }

  /* ---------- top bar ---------- */
  .top-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: flex-start;
    padding: 10px 12px 16px 14px; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,0));
  }
  .ftabs { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
  .ftabs button {
    color: rgba(255,255,255,.72); font-size: 14.5px; font-weight: 700;
    padding: 3px 1px 7px; position: relative; text-shadow: 0 1px 4px rgba(0,0,0,.4);
    white-space: nowrap;
  }
  .ftabs button.on { color: #fff; font-weight: 900; }
  .ftabs button.on::after {
    content: ""; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 26px; height: 3px; border-radius: 2px; background: #fff;
  }
  .tb-ic {
    position: absolute; top: 10px; pointer-events: auto;
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; color: #fff;
    background: rgba(0,0,0,.22);
  }
  .tb-ic:active { background: rgba(0,0,0,.4); }
  #muteBtn { right: 46px; }
  #cmpBtn { right: 82px; }
  #srchBtn { right: 10px; }

  /* ---------- video pager ---------- */
  .pager {
    position: absolute; inset: 0; overflow-y: scroll; overscroll-behavior: contain;
    scroll-snap-type: y mandatory; scrollbar-width: none; background: #000;
  }
  .pager::-webkit-scrollbar { display: none; }
  .pager.hidden { display: none; }
  .vcard {
    position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always;
    overflow: hidden; background: #000; color: #fff;
  }
  .vmedia { position: absolute; inset: 0; }
  .vcover {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    animation: kb 16s ease-in-out infinite alternate; animation-play-state: paused;
  }
  .vcard.playing .vcover { animation-play-state: running; }
  @keyframes kb {
    from { transform: scale(1.06); }
    to { transform: scale(1.16) translate(-1.2%, 1%); }
  }
  .vscrim-b { position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.38) 42%, rgba(0,0,0,.66) 100%); pointer-events: none; }
  .vscrim-t { position: absolute; left: 0; right: 0; top: 0; height: 15%; background: linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,0)); pointer-events: none; }

  /* play / pause flash */
  .pp-flash {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.6);
    width: 76px; height: 76px; border-radius: 50%; background: rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center; color: #fff;
    opacity: 0; pointer-events: none;
  }
  .pp-flash.show { animation: ppPop .55s ease forwards; }
  @keyframes ppPop {
    0% { opacity: .95; transform: translate(-50%,-50%) scale(.6); }
    60% { opacity: .95; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.05); }
  }

  /* double-tap heart burst */
  .burst { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; pointer-events: none; z-index: 25; animation: burst .9s ease forwards; color: var(--like); }
  @keyframes burst {
    0% { transform: scale(.2) rotate(-14deg); opacity: 0; }
    30% { transform: scale(1.18) rotate(6deg); opacity: 1; }
    55% { transform: scale(.94) rotate(-2deg); opacity: 1; }
    100% { transform: scale(1.3) translateY(-40px) rotate(0deg); opacity: 0; }
  }

  /* ---------- right action rail ---------- */
  .vright {
    position: absolute; right: 8px; bottom: 24px; z-index: 12;
    display: flex; flex-direction: column; align-items: center; gap: 17px; width: 54px;
  }
  .r-ava { position: relative; margin-bottom: 3px; }
  .r-ava-c {
    width: 46px; height: 46px; border-radius: 50%; border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 800; color: #fff;
  }
  .r-follow {
    position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%);
    width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900;
    line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  .vcard.followed .r-follow { background: #fff; color: var(--accent-deep); }
  .vcard.followed .r-follow::after { content: "✓"; font-size: 12px; }
  .vcard.followed .r-follow span { display: none; }
  .r-act { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #fff; }
  .r-act svg { filter: drop-shadow(0 1px 3px rgba(0,0,0,.4)); }
  .r-act b { font-size: 11px; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,.45); }
  .r-act .ic-heart { color: #fff; }
  .vcard.liked .ic-heart { color: var(--like); }
  .vcard.liked .ic-heart path { fill: var(--like); }
  .vcard.liked .r-act.lik b { color: var(--like); }
  .vcard.faved .ic-star { color: #FFC24B; }
  .vcard.faved .ic-star path { fill: #FFC24B; }
  .pop { animation: pop .32s ease; }
  @keyframes pop { 40% { transform: scale(1.35); } }
  .r-disc {
    width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
    border: 5px solid #1a1a1a; margin-top: 2px;
    animation: spin 7s linear infinite; animation-play-state: paused;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  .vcard.playing .r-disc { animation-play-state: running; }
  .r-disc img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- bottom info ---------- */
  .vinfo {
    position: absolute; left: 14px; right: 78px; bottom: 22px; z-index: 12;
    display: flex; flex-direction: column; gap: 7px; max-width: 78%;
  }
  .vhandle { font-size: 15.5px; font-weight: 800; display: flex; align-items: center; gap: 5px; text-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .vhandle .vf { width: 15px; height: 15px; border-radius: 50%; background: #20A4F3; color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .vcap {
    font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.96);
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .vcap.expanded { -webkit-line-clamp: unset; }
  .vcap .tag { font-weight: 800; }
  .vcap-more { align-self: flex-start; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.78); padding: 1px 0; }
  .vmusic { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.94); text-shadow: 0 1px 4px rgba(0,0,0,.5); max-width: 100%; }
  .mq { overflow: hidden; flex: 1; min-width: 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  .mq i { display: inline-block; font-style: normal; white-space: nowrap; padding-right: 34px; }
  .vcard.playing .mq i { animation: mq 8s linear infinite; }
  @keyframes mq { to { transform: translateX(-50%); } }
  .vloc { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,.82); text-shadow: 0 1px 4px rgba(0,0,0,.5); }

  /* progress bar */
  .vprog { position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px; background: rgba(255,255,255,.24); z-index: 14; }
  .vprog i { display: block; height: 100%; width: 0; background: #fff; animation: prog linear infinite; animation-play-state: paused; }
  .vcard.playing .vprog i { animation-play-state: running; }
  @keyframes prog { from { width: 0; } to { width: 100%; } }

  /* swipe hint on the first card */
  .sw-hint {
    position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 26;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: rgba(255,255,255,.85); font-size: 11.5px; font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,.5); pointer-events: none;
    animation: hintFloat 1.6s ease-in-out infinite; transition: opacity .4s;
  }
  .sw-hint.gone { opacity: 0; }
  @keyframes hintFloat { 50% { transform: translateX(-50%) translateY(7px); } }

  /* following-tab empty state */
  .fw-empty {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--text-2); text-align: center; padding: 0 44px; scroll-snap-align: start;
    background: var(--bg);
  }
  .fw-empty .fe-ic { width: 64px; height: 64px; border-radius: 22px; background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--text-3); border: 1px solid rgba(0,0,0,.08); }
  .fw-empty p { font-size: 13px; line-height: 1.5; }
  .fw-empty button { height: 40px; padding: 0 22px; border-radius: 20px; background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 800; }

  /* ---------- light sheets (comments / share) ---------- */
  .mask { position: absolute; inset: 0; z-index: 80; background: rgba(0,0,0,.42); opacity: 0; pointer-events: none; transition: opacity .22s; }
  .mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 90;
    background: var(--bg); border-radius: 20px 20px 0 0; transform: translateY(102%);
    transition: transform .28s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column;
    max-height: 68%;
  }
  .sheet.show { transform: none; }
  .sh-grab { width: 40px; height: 4.5px; border-radius: 3px; background: rgba(0,0,0,.16); margin: 9px auto 0; flex: none; }
  .sh-head { display: flex; align-items: center; justify-content: center; position: relative; padding: 10px 16px 8px; flex: none; }
  .sh-head b { font-size: 14px; font-weight: 800; color: var(--text); }
  .sh-x { position: absolute; right: 12px; top: 4px; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); color: var(--text-2); display: flex; align-items: center; justify-content: center; font-size: 15px; }

  /* comments */
  .cmt-list { overflow-y: auto; padding: 2px 16px 10px; display: grid; gap: 15px; }
  .cmt-row2 { display: flex; gap: 10px; align-items: flex-start; }
  .cmt-ava {
    width: 34px; height: 34px; border-radius: 50%; flex: none; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;
  }
  .cmt-body { flex: 1; min-width: 0; }
  .cmt-name { font-size: 11.5px; color: var(--text-3); font-weight: 700; }
  .cmt-text { font-size: 13.5px; color: var(--text); line-height: 1.45; margin-top: 2px; word-break: break-word; }
  .cmt-meta { display: flex; gap: 14px; margin-top: 5px; font-size: 11.5px; color: var(--text-3); font-weight: 600; }
  .cmt-meta .clike { display: flex; align-items: center; gap: 4px; }
  .cmt-meta .clike.on { color: var(--like); }
  .cmt-input-row { display: flex; gap: 9px; padding: 9px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(0,0,0,.07); background: var(--bg); flex: none; }
  .cmt-input-row input {
    flex: 1; height: 40px; border: none; outline: none; border-radius: 20px;
    background: var(--surface); padding: 0 16px; font-size: 13.5px; color: var(--text);
  }
  .cmt-send { height: 40px; padding: 0 18px; border-radius: 20px; background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 800; }
  .cmt-send:disabled { opacity: .4; }

  /* share */
  .share-tabs { display: flex; gap: 8px; padding: 2px 16px 10px; flex: none; }
  .share-tabs button { flex: 1; height: 36px; border-radius: 18px; background: var(--surface); font-size: 13px; font-weight: 700; color: var(--text-2); border: 1px solid rgba(0,0,0,.08); }
  .share-tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .share-list { overflow-y: auto; padding: 2px 16px calc(16px + env(safe-area-inset-bottom)); }
  .share-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; }
  .share-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; color: var(--text); }
  .share-name small { display: block; font-size: 11px; color: var(--text-3); font-weight: 600; margin-top: 1px; }
  .share-send { height: 32px; padding: 0 16px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 800; }
  .share-send.sent { background: var(--surface-2); color: var(--text-2); }
  .share-send:disabled { opacity: .55; }
  .share-post-box { display: grid; gap: 10px; }
  .share-post-box textarea {
    height: 84px; border: none; outline: none; resize: none; border-radius: 14px;
    background: var(--surface); padding: 12px 14px; font-size: 13.5px; color: var(--text); font-family: inherit; line-height: 1.5;
  }
  .post-btn { height: 44px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 800; }
  .share-hint { font-size: 11.5px; color: var(--text-3); text-align: center; line-height: 1.5; padding: 2px 8px 6px; }
  .mp-card { display: flex; gap: 10px; background: var(--surface); border-radius: 14px; padding: 10px; }
  .mp-thumb { width: 62px; height: 82px; border-radius: 10px; overflow: hidden; flex: none; background: var(--surface-2); }
  .mp-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .mp-title { font-size: 13.5px; font-weight: 800; color: var(--text); }
  .mp-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .mp-tags span { font-size: 10px; font-weight: 700; color: var(--accent-deep); background: var(--accent-soft); padding: 3px 8px; border-radius: 8px; }
  .mp-view { height: 42px; border-radius: 14px; background: var(--surface); color: var(--accent-deep); font-size: 13px; font-weight: 800; border: 1px solid rgba(0,0,0,.08); }
  .my-post.posted { display: grid; gap: 10px; }
  .mp-head { display: flex; align-items: center; gap: 9px; }
  .mp-who { font-size: 13.5px; font-weight: 800; color: var(--text); }
  .mp-who small { display: block; font-size: 11px; color: var(--text-3); font-weight: 600; }
  .mp-text { font-size: 13.5px; color: var(--text); line-height: 1.5; }

  /* ---------- search overlay (light) ---------- */
  .srch {
    position: absolute; inset: 0; z-index: 70; background: var(--bg);
    transform: translateY(4%); opacity: 0; pointer-events: none; transition: all .24s;
    display: flex; flex-direction: column;
  }
  .srch.show { transform: none; opacity: 1; pointer-events: auto; }
  .sr-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid rgba(0,0,0,.06); background: var(--bg); }
  .sr-box { flex: 1; display: flex; align-items: center; gap: 8px; height: 40px; border-radius: 20px; background: var(--surface); padding: 0 14px; border: 1px solid rgba(0,0,0,.08); }
  .sr-box svg { color: var(--text-3); flex: none; }
  .sr-box input { flex: 1; min-width: 0; border: none; outline: none; background: none; font-size: 13.5px; color: var(--text); }
  .sr-box input::placeholder { color: var(--text-3); }
  #srClear { display: none; color: var(--text-3); }
  #srClear.show { display: flex; }
  .sr-cancel { font-size: 14px; font-weight: 700; color: var(--accent-deep); }
  .sr-body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }
  .sr-sec { font-size: 11.5px; font-weight: 800; letter-spacing: .4px; color: var(--text-3); margin-bottom: 10px; }
  .sr-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .sr-chips button { height: 32px; padding: 0 14px; border-radius: 16px; background: var(--surface); border: 1px solid rgba(0,0,0,.08); font-size: 12.5px; font-weight: 700; color: var(--text-2); }
  .sr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .sr-cell { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 9/14; background: var(--surface-2); cursor: pointer; }
  .sr-cell img { width: 100%; height: 100%; object-fit: cover; }
  .sr-cell .sc-play { position: absolute; left: 6px; bottom: 5px; color: #fff; font-size: 10px; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,.6); display: flex; align-items: center; gap: 3px; }
  .sr-cell .sc-cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 7px 6px; color: #fff; font-size: 10.5px; font-weight: 700; line-height: 1.35;
    background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.62));
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sr-empty { text-align: center; color: var(--text-3); font-size: 13px; padding: 40px 0; }

  /* toast */
  .toast {
    position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%) translateY(8px); z-index: 100;
    background: rgba(20,20,20,.92); color: #fff; font-size: 13px; font-weight: 700;
    padding: 10px 18px; border-radius: 22px; opacity: 0; pointer-events: none;
    transition: all .25s; max-width: 82%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* chips in the location row (near distance / trending rank) */
  .vloc .chip {
    display: inline-flex; align-items: center; margin-left: 4px;
    background: rgba(255,255,255,.18); border-radius: 9px; padding: 2px 7px;
    font-size: 10px; font-weight: 800; color: #fff; text-shadow: none;
  }
  .vloc .chip.hot { background: rgba(226,75,74,.92); }

  /* avatar / handle are tappable -> creator profile */
  .r-ava { cursor: pointer; }
  .vhandle { cursor: pointer; }

  /* ---------- composer overlay (unified publish entry, light full-screen) ---------- */
  .cmp {
    position: absolute; inset: 0; z-index: 75; background: var(--bg);
    transform: translateY(4%); opacity: 0; pointer-events: none; transition: all .24s;
    display: flex; flex-direction: column;
  }
  .cmp.show { transform: none; opacity: 1; pointer-events: auto; }
  .cmp-head { display: flex; align-items: center; justify-content: center; position: relative; padding: 14px 16px 10px; border-bottom: 1px solid rgba(0,0,0,.06); flex: none; }
  .cmp-head b { font-size: 14px; font-weight: 800; color: var(--text); }
  .cmp-body { flex: 1; overflow-y: auto; padding: 14px 16px 12px; }
  .cmp-sec { font-size: 11.5px; font-weight: 800; letter-spacing: .4px; color: var(--text-3); margin: 2px 0 9px; }
  .cmp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .cmp-cell { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 9/14; background: var(--surface-2); cursor: pointer; padding: 0; }
  .cmp-cell img { width: 100%; height: 100%; object-fit: cover; }
  .cmp-cell .ck {
    position: absolute; right: 5px; top: 5px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,.35); border: 1.5px solid rgba(255,255,255,.85);
    display: flex; align-items: center; justify-content: center; color: transparent;
  }
  .cmp-cell.on .ck { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cmp-cell.on { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cmp-cap {
    width: 100%; height: 74px; border: none; outline: none; resize: none; border-radius: 14px;
    background: var(--surface); padding: 12px 14px; font-size: 13.5px; color: var(--text);
    font-family: inherit; line-height: 1.5; margin-bottom: 14px; border: 1px solid rgba(0,0,0,.08);
  }
  .cmp-cap::placeholder { color: var(--text-3); }
  .cmp-topics { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .cmp-topics button { height: 32px; padding: 0 14px; border-radius: 16px; background: var(--surface); border: 1px solid rgba(0,0,0,.08); font-size: 12.5px; font-weight: 700; color: var(--text-2); }
  .cmp-topics button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); }

  /* ---------- share: the shell owns Chats & Feeds; the sheet asks it live ---------- */
  let shareContacts = [], shareGroups = [];
  let shareLoaded = false, shareLoading = false, shareFailed = false, shareTabCur = 'contacts';
  let shareReqId = 0, shareQueue = [];
  const sharePending = {};
  const avaColors = ['#e8a0b4', '#8fb8a8', '#c9a86a', '#7f9cc4', '#b48fad', '#8fc4b8'];
  let shareOpenId = null;

  function shellRequest(msg, cb) {
    if (!EMBEDDED) { cb(null); return; }
    const rid = 'rr' + (++shareReqId);
    sharePending[rid] = cb;
    msg.rid = rid;
    try { window.parent.postMessage(msg, '*'); }
    catch (e) { delete sharePending[rid]; cb(null); return; }
    setTimeout(() => { if (sharePending[rid]) { delete sharePending[rid]; cb(null); } }, 3000);
  }
  function shellPerson(p) { return { idx: p.idx, n: p.n, ini: p.ini || (p.n || '?').charAt(0), s: p.sub || '' }; }
  /* the shell renders shared cards from these fields (drama-shaped on purpose) */
  function videoPayload(v) {
    return { t: v.t[rlang] || v.t.en, s: '@' + v.handle, r: '', p: '', cat: (v.cap[rlang] || v.cap.en).match(/#(\w+)/) ? '' : '',
             e: '🎬', img: v.img, g: '' };
  }
  function loadShareData(done) {
    if (shareLoaded || !EMBEDDED) { done && done(); return; }
    if (done) shareQueue.push(done);
    if (shareLoading) return;
    shareLoading = true;
    shellRequest({ wahdaMsg: 'friends' }, function (d) {
      shareLoading = false;
      if (d) { shareLoaded = true; shareFailed = false; } else { shareFailed = true; }
      const q = shareQueue; shareQueue = [];
      q.forEach(fn => { try { fn() } catch (err) {} });
    });
  }
  function openShare(e, id) {
    if (e) e.stopPropagation();
    const v = vById(id); if (!v) return;
    shareOpenId = id;
    $('shrMask').classList.add('show'); $('shrSheet').classList.add('show');
    renderShare('contacts');
    loadShareData(() => { if (shareOpenId === id && shareTabCur === 'contacts') renderShare('contacts', null, true); });
  }
  function closeShare() { $('shrMask').classList.remove('show'); $('shrSheet').classList.remove('show'); shareOpenId = null; }
  function renderShare(tab, btn, silent) {
    shareTabCur = tab;
    if (btn) {
      document.querySelectorAll('#shareTabs button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
    } else if (!silent) {
      const order = { contacts: 0, groups: 1, post: 2 };
      document.querySelectorAll('#shareTabs button').forEach((b, i) => b.classList.toggle('on', i === order[tab]));
    }
    const box = $('shareList');
    const v = vById(shareOpenId) || VIDS[0];
    if (tab === 'post') {
      box.innerHTML = '<div class="share-post-box">' +
        '<textarea id="postCaption">' + esc(T('postcap') + '"' + (v.t[rlang] || v.t.en) + '" — @' + v.handle + ' 🎬') + '</textarea>' +
        '<button class="post-btn" onclick="sendToMyPost()">' + T('mypost') + '</button>' +
        '<div class="share-hint">' + (rlang === 'zh' ? '将作为帖子发布到 <b>Feeds</b> 和 <b>My Hub · Posts</b>' : 'Publishes a post to <b>Feeds</b> and <b>My Hub · Posts</b>') + '</div></div>';
      return;
    }
    if (!EMBEDDED) {
      box.innerHTML = '<div class="share-hint">' + (rlang === 'zh' ? '在 Wahda App 内打开 Reels 即可分享给聊天。' : 'Open this Reels page inside the Wahda app to share with your chats.') + '</div>';
      return;
    }
    const data = tab === 'contacts' ? shareContacts : shareGroups;
    if (!data.length) {
      const what = tab === 'contacts' ? (rlang === 'zh' ? '好友' : 'contacts') : (rlang === 'zh' ? '群聊' : 'groups');
      const hint = shareLoaded ? (rlang === 'zh' ? '暂无可分享的' + what + '。' : 'No ' + what + ' available yet.')
        : shareFailed ? (rlang === 'zh' ? '无法加载聊天 — 请在 App 内打开 Reels。' : 'Could not load your chats — open Reels inside the Wahda app.')
        : (rlang === 'zh' ? '正在加载' + what + '…' : 'Loading your ' + what + '…');
      box.innerHTML = '<div class="share-hint">' + hint + '</div>';
      if (!shareLoaded && !shareFailed) loadShareData(() => { if (shareTabCur === tab) renderShare(tab, null, true); });
      return;
    }
    box.innerHTML = data.map((p, i) =>
      '<div class="share-row">' +
        '<span class="cmt-ava" style="background:' + avaColors[i % avaColors.length] + '">' + esc(p.ini) + '</span>' +
        '<div class="share-name">' + esc(p.n) + '<small>' + esc(p.s) + '</small></div>' +
        '<button class="share-send" id="shr' + tab + i + '" onclick="shareTo(\'' + tab + '\',' + i + ')">' + (rlang === 'zh' ? '发送' : 'Send') + '</button></div>').join('');
  }
  function shareTo(tab, i) {
    const btn = $('shr' + tab + i);
    const person = (tab === 'contacts' ? shareContacts : shareGroups)[i];
    if (!person || (btn && btn.classList.contains('sent'))) return;
    if (!EMBEDDED) { toast(rlang === 'zh' ? '请在 App 内分享到聊天' : 'Open inside the Wahda app to share to chats'); return; }
    if (btn) { btn.disabled = true; btn.textContent = rlang === 'zh' ? '发送中…' : 'Sending…'; }
    const v = vById(shareOpenId);
    shellRequest({ wahdaMsg: 'share', idx: person.idx, peerName: person.n, drama: videoPayload(v) }, function (ack) {

  let cmpClip = null, cmpSyncOn = true, myReelSeq = 0, cmpTopicsSel = [];

  /* ---------- jump to a video (chat share / search / gate resume) ---------- */
  function jumpTo(tab, idOrTitle, autoplay) {
    if (tab === 'fw' && curTab !== 'fw') pickFeed('fw');
    if (tab === 'fy' && curTab !== 'fy') pickFeed('fy');
    const v = VIDS.filter(x => x.id === idOrTitle || x.t.en === idOrTitle || x.t.zh === idOrTitle)[0];
    if (!v) return;
    const p = activePager();
    const idx = Array.from(p.children).findIndex(c => c.dataset && c.dataset.id === v.id);
    if (idx < 0) return;                                   /* not in this tab's list */
    curIdx = idx;
    p.scrollTop = idx * p.clientHeight;
    if (autoplay !== false) playing = true;
    refreshPlayState();
  }

  /* ---------- keyboard (standalone review / focused iframe) ---------- */
  window.addEventListener('keydown', e => {
    if ($('srchView').classList.contains('show')) return;
    const p = activePager();
    if (e.key === 'ArrowDown') { curIdx = Math.min(p.children.length - 1, curIdx + 1); p.scrollTop = curIdx * p.clientHeight; e.preventDefault(); }
    else if (e.key === 'ArrowUp') { curIdx = Math.max(0, curIdx - 1); p.scrollTop = curIdx * p.clientHeight; e.preventDefault(); }
    else if (e.key === ' ') { const c = activePager().children[curIdx]; if (c && c.dataset && c.dataset.id) { togglePlay(c.dataset.id); e.preventDefault(); } }
  });

  /* ---------- bridge with the app shell ---------- */
  window.addEventListener('message', function (e) {
    const d = e.data || {};
    if (d.wahdaMsg === 'ctx') {
      guestMode = !!d.guest;
      if (d.lang && d.lang !== rlang) { rlang = d.lang; paintAll(); }
      return;
    }
    if (d.wahdaMsg === 'friends') {
      shareContacts = (d.contacts || []).map(shellPerson);
      shareGroups = (d.groups || []).map(shellPerson);
    } else if (d.wahdaMsg === 'play' && d.title) {
      jumpTo('fy', d.title, true); return;
    } else if (d.wahdaMsg === 'resumeShare') {
      const v = vById(shareOpenId) || VIDS[curIdx % VIDS.length];
      openShare(null, v.id);
      return;
    } else if (d.wahdaMsg === 'compose') {
      openComposer(); return;
    } else if (d.wahdaMsg === 'open-reel' && d.vid) {
      if (curTab !== 'fy') pickFeed('fy');
      jumpTo('fy', d.vid, true); return;
    } else if (d.wahdaMsg !== 'share-ack' && d.wahdaMsg !== 'post-ack' && d.wahdaMsg !== 'reel-feed-ack') {
      return;

    const cb = sharePending[d.rid];
    if (cb) { delete sharePending[d.rid]; cb(d); }
